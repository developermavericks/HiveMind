<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HiveMind · Editorial intelligence</title>
<link rel="icon" type="image/png" href="/ui/logo.png">
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="brand-hex" role="img" aria-label="HiveMind logo"></span><div><img class="brand-word" src="/ui/wordmark.png" alt="HiveMind" width="104" height="17"><span>Editorial intelligence</span></div></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <nav class="nav-bottom" id="nav2" aria-label="Help and settings"></nav>
    <div class="userbox" id="userbox"></div>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="grow"><h1 id="ttl">HiveMind</h1><div class="sub" id="sub">Loading…</div></div>
      <div class="ctl">
        <label>Company <select id="csel"></select></label>
        <label title="Replay the dashboard as of the end of a stored day">View <select id="dsel"></select></label>
        <span class="pill p-muted dot" id="llm">LLM</span>
        <button class="iconbtn" id="bell" title="Notifications" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/></svg><span class="badge" id="bellb" style="display:none"></span></button>
        <button class="iconbtn" id="theme" title="Toggle light / dark" aria-label="Toggle light or dark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button class="iconbtn" id="print" title="Print or save as PDF" aria-label="Print"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg></button>
        <div style="position:relative">
          <button class="btn sm" id="runtoggle">Run ▾</button>
          <div id="runpanel" style="display:none">
            <h4>Collect news</h4>
            <div class="ctl"><select id="rmode" class="f" style="width:auto"><option value="latest">Latest 24 hours</option><option value="day">A specific day</option></select><input type="date" id="rday" style="display:none"></div>
            <p class="tiny mute" style="margin:6px 0 8px">Reads every story not already stored. Existing data is never changed.</p>
            <button class="btn" id="rgo">Run collection</button>
            <hr>
            <h4>Label topics</h4>
            <p class="tiny mute" style="margin:0 0 8px">Adds specific topic labels, content type, entities and causal pathways to stories already read. One small LLM call per story.</p>
            <button class="btn ghost" id="renrich">Label topics…</button>
          </div>
        </div>
      </div>
    </header>
    <div class="banner info" id="job" style="display:none"></div>
    <div class="tabbar" id="tabs"></div>
    <main class="page" id="page"></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Opportunity detail"></aside>
<aside class="notif" id="notif" aria-label="Notifications"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="infopop" id="infopop" role="tooltip"></div>
<div class="tip" id="tip"></div>
<script src="/ui/charts.js"></script>
<script src="/ui/pages.js"></script>
<script src="/ui/extra.js"></script>
<script src="/ui/quality.js"></script>
<script src="/ui/simple.js"></script>
<script src="/ui/app.js"></script>
</body>
</html>
