# HiveMind Enterprise Production Stack: docker compose up -d --build (then open http://localhost:8788)
#
# Services:
#   - postgres: PostgreSQL 16 database for multi-user scaling, concurrent transactions, and audit history
#   - app: HiveMind Node 24 application server with production cyber-defense, rate limiting, and analytics
#   - backup: automated daily database snapshot backup
name: hivemind

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hivemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hivemind_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-hivemind}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hivemind} -d ${POSTGRES_DB:-hivemind}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: hivemind:latest
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${HIVEMIND_PORT:-8788}:8788"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hivemind}:${POSTGRES_PASSWORD:-hivemind_secret_2026}@postgres:5432/${POSTGRES_DB:-hivemind}
      HIVEMIND_HOST: 0.0.0.0
      HIVEMIND_ALLOWED_HOSTS: ${HIVEMIND_ALLOWED_HOSTS:-localhost,127.0.0.1}
      HIVEMIND_ADMIN_EMAIL: ${HIVEMIND_ADMIN_EMAIL:-}
      HIVEMIND_AUTO: ${HIVEMIND_AUTO:-0}
      HIVEMIND_SCHEDULE_MINUTES: ${HIVEMIND_SCHEDULE_MINUTES:-480}
      HIVEMIND_COOKIE_SECURE: ${HIVEMIND_COOKIE_SECURE:-0}
    volumes:
      - hivemind-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-hivemind_secret_2026}
    volumes:
      - hivemind-data:/app/data
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          mkdir -p /app/data/backups
          pg_dump -h postgres -U ${POSTGRES_USER:-hivemind} ${POSTGRES_DB:-hivemind} | gzip > /app/data/backups/backup-$$(date +%Y%m%d-%H%M%S).sql.gz
          find /app/data/backups -type f -mtime +14 -delete
          sleep 86400
        done

volumes:
  hivemind-data:
  postgres-data:
