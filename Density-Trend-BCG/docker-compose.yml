# HiveMind Production Stack: docker compose up -d --build (then open http://localhost:8788)
#
# Services:
#   - app: HiveMind Node 24 application server with production cyber-defense, rate limiting, and analytics
#   - backup: automated daily database snapshot backup (VACUUM INTO, safe under concurrent writes)
name: hivemind

x-app: &app
  build: .
  image: hivemind:latest
  init: true
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  volumes:
    - hivemind-data:/app/data

services:
  app:
    <<: *app
    ports:
      - "127.0.0.1:${HIVEMIND_PORT:-8788}:8788" # loopback only; Caddy or GCP Load Balancer handles HTTPS
    environment:
      HIVEMIND_HOST: 0.0.0.0
      HIVEMIND_ALLOWED_HOSTS: ${HIVEMIND_ALLOWED_HOSTS:-localhost,127.0.0.1}
      HIVEMIND_ADMIN_EMAIL: ${HIVEMIND_ADMIN_EMAIL:-}
      HIVEMIND_AUTO: ${HIVEMIND_AUTO:-0}
      HIVEMIND_SCHEDULE_MINUTES: ${HIVEMIND_SCHEDULE_MINUTES:-480}
      HIVEMIND_COOKIE_SECURE: ${HIVEMIND_COOKIE_SECURE:-0}
      HIVEMIND_TRUST_PROXY: ${HIVEMIND_TRUST_PROXY:-1}
      HIVEMIND_WORKERS: ${HIVEMIND_WORKERS:-4}
      DATABASE_URL: ${DATABASE_URL:-}
    depends_on:
      postgres:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # High-performance enterprise PostgreSQL database for 100+ concurrent cloud users
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hivemind}
      POSTGRES_USER: ${POSTGRES_USER:-hivemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hivemind_secure_pass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hivemind} -d ${POSTGRES_DB:-hivemind}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Consistent point-in-time copy of data/hivemind.db every 24h, 14 kept, in data/backups/
  backup:
    <<: *app
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "while true; do node --no-warnings src/cli.mjs backup --keep 14; sleep 86400; done"]
    healthcheck:
      disable: true

volumes:
  hivemind-data:
  postgres-data:
